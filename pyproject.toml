[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodcli"
version = "0.1.0"
description = "CLI de produtividade: todo, notes, timer e habit no terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prod = "prodcli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
